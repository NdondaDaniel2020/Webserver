<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Web Ninjas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at top left, #111827, #0D0F14 70%);
            color: #E5E7EB;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        .logo-symbol {
            font-family: monospace;
            font-size: 22px;
            color: #00FF9C;
            margin-bottom: 20px;
            letter-spacing: 4px;
            opacity: 0.8;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .highlight {
            color: #00FF9C;
            text-shadow: 0 0 10px rgba(0, 255, 156, 0.7);
        }

        p {
            font-size: 18px;
            color: #9CA3AF;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s ease;
            border: 1px solid #00FF9C;
        }

        .btn-primary {
            background-color: #00FF9C;
            color: #0D0F14;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: #00FF9C;
            box-shadow: 0 0 15px #00FF9C;
        }

        .btn-secondary {
            background-color: transparent;
            color: #00FF9C;
        }

        .btn-secondary:hover {
            background-color: #00FF9C;
            color: #0D0F14;
            box-shadow: 0 0 15px #00FF9C;
        }

        /* Subtle animated background lines */
        .background-lines {
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                rgba(0,255,156,0.03),
                rgba(0,255,156,0.03) 1px,
                transparent 1px,
                transparent 50px
            );
            animation: move 20s linear infinite;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-50px, -50px);
            }
        }
    </style>
</head>
<body>

<div class="background-lines"></div>

<section class="hero">

    <img src="https://img.icons8.com/ios-filled/100/00ff9c/ninja-head.png" alt="Web Ninjas Logo" style="margin-bottom: 20px;">
    
    <div class="logo-symbol">&lt; WEB_NINJAS /&gt;</div>

    <h1>
        <span class="highlight">WEB</span> NINJAS
    </h1>

    <p>
        Mastering HTTP in Silence.<br>
        A high-performance non-blocking HTTP server built in C++98.
    </p>

    <div class="buttons">
        <a href="#" class="btn btn-primary">View Documentation</a>
        <a href="#" class="btn btn-secondary">Run Demo</a>
    </div>
</section>

</body>
</html>
