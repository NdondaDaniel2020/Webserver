# ============================================================================
# Exemplo prático: INDEX OVERRIDE
# Demonstra diferentes arquivos index para diferentes locations
# ============================================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root www;
    
    index index.html index.htm default.html;
    
    location / {
        allowed_methods GET;
    }
    
    location /docs {
        allowed_methods GET;
        index README.html README.htm index.html;
        autoindex on;
    }
    
    location /blog {
        allowed_methods GET POST;
    }
    
    location /admin {
        allowed_methods GET POST;
        index dashboard.html admin.html index.html;
    }
    
    location /api {
        allowed_methods GET POST DELETE;
    }
    
    location /pt {
        allowed_methods GET;
        index index-pt.html index-pt.htm;
    }
    
    location /en {
        allowed_methods GET;
        index index-en.html index-en.htm;
    }
    
    location /fr {
        allowed_methods GET;
        index index-fr.html index-fr.htm;
    }
}
