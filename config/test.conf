# ============================================================================
# WEBSERVER TEST CONFIGURATION - Comprehensive Test Suite
# Otimizada para testes completos e validação de todos os status codes
# Data: 2026-04-10
# Descrição: Configuração de múltiplos servidores com todas as rotas de teste
# ============================================================================

# ============================================================================
# SERVIDOR 1: Main Test Server (Porta 8080) - TESTES PRINCIPAIS
# Configuração completa com todas as rotas e status codes
# ============================================================================
server {
    listen 127.0.0.1:8080;
    server_name test.webserver.local test-server;
    root www;
    index index.html index.htm;
    timeout 120;
    cgi_timeout 5;
    client_max_body_size 10M;

    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 408 /errors/408.html;
    error_page 409 /errors/409.html;
    error_page 411 /errors/411.html;
    error_page 413 /errors/413.html;
    error_page 414 /errors/414.html;
    error_page 415 /errors/415.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 501 /errors/501.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;
    error_page 505 /errors/505.html;

    location / {
        allowed_methods GET;
        index index.html index.htm;
    }

    location /landing {
        allowed_methods GET;
        root www;
        index landing.html;
    }

    location /login {
        allowed_methods GET;
        root www;
        index login.html;
    }

    location /dashboard {
        allowed_methods GET;
        root www;
        index dashboard.html;
    }

    location /uploads {
        allowed_methods GET POST DELETE;
        root www/uploads;
        upload_dir uploads;
        client_max_body_size 50M;
        autoindex on;
        timeout 300;
    }

    location /downloads {
        allowed_methods GET;
        root www;
        autoindex on;
        timeout 60;
    }

    location /assets {
        allowed_methods GET;
        root www;
        autoindex off;
        timeout 30;
    }

    location /images {
        allowed_methods GET;
        root www;
        autoindex on;
        timeout 30;
    }

    location /api {
        allowed_methods GET POST DELETE;
        root www;
        timeout 60;
        autoindex off;
    }

    location /cgi-bin {
        allowed_methods GET POST DELETE;
        root www;
        cgi_timeout 5;
        timeout 60;
        
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
        
        autoindex off;
    }

    location /test {
        allowed_methods GET POST DELETE;
        root www/test;
        timeout 60;
        autoindex on;
    }

    location /YoupiBanane {
        allowed_methods GET;
        root .;
        index index.html youpi.bla;
        autoindex on;
    }

    location /old-page {
        return 301 /index.html;
    }

    location /redirect-external {
        return 302 https://www.42.fr;
    }

    location /temporary-redirect {
        return 307 /index.html;
    }

    location /admin {
        return 403;
    }

    location /restricted {
        return 422;
    }

    location /maintenance {
        allowed_methods GET;
        return 503;
    }
}
