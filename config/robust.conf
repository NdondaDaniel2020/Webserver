# ============================================================================
# WEBSERVER - CONFIGURAÇÃO ROBUSTA E COMPLETA
# Versão: 1.0 - Otimizada para Performance (Fase 1)
# Data: 2026-04-06
# Descrição: Configuração de múltiplos servidores com funcionalidades completas
# ============================================================================

# ============================================================================
# SERVIDOR 1: Portal Principal (Porta 8080) - PRODUÇÃO
# Configuração otimizada para produção com Performance Phase 1
# ============================================================================
server {
    listen 127.0.0.1:8080;
    server_name webserver.local production.webserver;
    root www;
    index index.html index.htm default.html;
    timeout 120;
    cgi_timeout 30;
    client_max_body_size 10M;


    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;


    location / {
        allowed_methods GET;
        index index.html index.htm default.html;
    }

    location /landing {
        allowed_methods GET;
        root www;
        index landing.html;
    }

    location /login {
        allowed_methods GET;
        root www;
        index login.html;
    }

    location /uploads {
        allowed_methods GET POST DELETE;
        root www/uploads;
        upload_dir uploads;
        client_max_body_size 50M;
        autoindex on;
        timeout 300;
    }

    location /assets {
        allowed_methods GET;
        root www;
        autoindex off;
        timeout 30;
    }

    location /images {
        allowed_methods GET;
        root www;
        autoindex on;
        timeout 30;
    }

    location /downloads {
        allowed_methods GET;
        root www;
        autoindex on;
        timeout 600;
    }

    location /cgi-bin {
        allowed_methods GET POST DELETE;
        root www;
        cgi_timeout 60;
        timeout 180;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
        autoindex off;
    }

    location /api {
        allowed_methods GET POST DELETE;
        root www;
        timeout 60;
        autoindex off;
    }

    location /old-page {
        return 301 /index.html;
    }

    location /redirect-external {
        return 302 https://www.42.fr;
    }

    location /temporary-redirect {
        return 307 /index.html;
    }

    location /maintenance {
        allowed_methods GET;
        return 503 /errors/503.html;
    }

    location /admin {
        return 403;
    }
}

# ============================================================================
# SERVIDOR 2: Servidor de Teste (Porta 8081)
# Configuração com timeouts curtos para teste rápido
# ============================================================================
server {
    listen 127.0.0.1:8081;
    server_name test.webserver.local;
    root www;
    index index.html;
    
    timeout 60;
    cgi_timeout 20;
    client_max_body_size 5M;

    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 5xx /errors/500.html;

    location / {
        allowed_methods GET;
        index index.html index.htm;
    }

    location /uploads {
        allowed_methods GET POST;
        root www/uploads;
        client_max_body_size 25M;
        autoindex on;
        timeout 120;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        root www;
        cgi_timeout 15;
        timeout 60;
        
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

# ============================================================================
# SERVIDOR 3: Servidor de Desenvolvimento (Porta 8082)
# Configuração com timeouts longos para debugging e testes
# ====================================================================
server {
    listen 127.0.0.1:8082;
    server_name dev.webserver.local development;
    root www;
    index index.html;
    
    timeout 300;
    cgi_timeout 120;
    client_max_body_size 100M;

    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 5xx /errors/500.html;

    location / {
        allowed_methods GET;
        index index.html;
    }

    location /uploads {
        allowed_methods GET POST DELETE;
        root www/uploads;
        upload_dir uploads;
        client_max_body_size 500M;
        autoindex on;
        timeout 600;
    }

    location /cgi-bin {
        allowed_methods GET POST DELETE;
        root www;
        cgi_timeout 180;
        timeout 600;
        
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
        
        autoindex on;
    }

    location /admin {
        allowed_methods GET POST DELETE;
        root www;
        autoindex on;
    }

    location /api {
        allowed_methods GET POST DELETE;
        root www;
        autoindex on;
    }
}
