# ============================================================================
# Webserv - Arquivo de Configuração Completo
# Este arquivo demonstra TODAS as funcionalidades exigidas pelo subject
# ============================================================================

# ----------------------------------------------------------------------------
# SERVIDOR 1: Website Principal (Porta 8080)
# ----------------------------------------------------------------------------
server {
    # Interface:porta para escutar
    listen 127.0.0.1:8080;
    
    # Nome do servidor (host virtual)
    server_name www.example.com;
    
    # Diretório raiz dos arquivos
    root www;
    
    # Arquivos de índice padrão (em ordem de prioridade)
    index index.html index.htm default.html;
    
    # Tamanho máximo do body da requisição (corpo da requisição)
    client_max_body_size 10M;
    
    # Páginas de erro personalizadas
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/500.html;
    #error_page 403 /errors/403.html;
    
    # --------------------------------------------------
    # LOCATION 1: Rota raiz - GET apenas
    # --------------------------------------------------
    location / {
        allowed_methods GET;
        index index.html;
    }
    
    # --------------------------------------------------
    # LOCATION 2: Uploads - GET, POST, DELETE
    # --------------------------------------------------
    location /uploads {
        allowed_methods GET POST DELETE;
        root /tmp/uploads;
        upload_dir /tmp/uploads;
        client_max_body_size 50M;
        autoindex on;
    }
    
    # --------------------------------------------------
    # LOCATION 3: Imagens - GET com autoindex
    # --------------------------------------------------
    location /images {
        allowed_methods GET;
        root www/images;
        autoindex on;
    }
    
    # --------------------------------------------------
    # LOCATION 4: Downloads - Listagem de diretório
    # --------------------------------------------------
    location /downloads {
        allowed_methods GET;
        autoindex on;
    }
    
    # --------------------------------------------------
    # LOCATION 5: Redirect HTTP (301 permanente)
    # --------------------------------------------------
    location /old-page {
        return 301 /new-page;
    }
    
    location /redirect-external {
        return 302 https://www.google.com;
    }
    
    # --------------------------------------------------
    # LOCATION 6: CGI - PHP scripts
    # --------------------------------------------------
    location /cgi-bin {
        allowed_methods GET POST;
        root cgi-bin;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
    }
    
    # --------------------------------------------------
    # LOCATION 7: API REST - POST e DELETE permitidos
    # --------------------------------------------------
    location /api {
        allowed_methods GET POST DELETE;
        client_max_body_size 5M;
    }
}

# ----------------------------------------------------------------------------
# SERVIDOR 2: API Server (Porta 8081)
# ----------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root api;
    
    client_max_body_size 20M;
    
    error_page 404 /api-errors/404.json;
    error_page 500 /api-errors/500.json;
    
    # Endpoint de usuários
    location /users {
        allowed_methods GET POST DELETE;
    }
    
    # Endpoint de arquivos
    location /files {
        allowed_methods GET POST DELETE;
        upload_dir /tmp/api-uploads;
        client_max_body_size 100M;
    }
}

# ----------------------------------------------------------------------------
# SERVIDOR 3: Site Estático com Python CGI (Porta 8082)
# ----------------------------------------------------------------------------
server {
    listen 127.0.0.1:8082;
    server_name www.google.com;
    root static-site;
    
    index home.html;
    client_max_body_size 5M;
    
    error_page 404 /404.html;
    
    # Página inicial
    location / {
        allowed_methods GET;
    }
    
    # Scripts Python CGI
    location /scripts {
        allowed_methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
    
    # Galeria com autoindex
    location /gallery {
        allowed_methods GET;
        autoindex on;
    }
}

# ----------------------------------------------------------------------------
# SERVIDOR 4: Upload Server (Porta 8083)
# ----------------------------------------------------------------------------
server {
    listen 127.0.0.1:8083;
    server_name www.google.com;
    root upload-server;
    
    client_max_body_size 500M;
    
    error_page 413 /errors/file-too-large.html;
    error_page 404 /errors/not-found.html;
    
    # Interface de upload
    location / {
        allowed_methods GET POST;
        index upload.html;
    }
    
    # Storage de arquivos grandes
    location /storage {
        allowed_methods GET POST DELETE;
        upload_dir /var/uploads/storage;
        autoindex on;
        client_max_body_size 1000M;
    }
    
    # Arquivos temporários
    location /temp {
        allowed_methods GET POST DELETE;
        upload_dir /tmp/temp-uploads;
        client_max_body_size 100M;
    }
}

# ----------------------------------------------------------------------------
# SERVIDOR 5: Teste Completo (Porta 9000)
# ----------------------------------------------------------------------------
server {
    listen 127.0.0.1:9000;
    server_name localhost;
    root tests/www;
    
    index test.html;
    client_max_body_size 15M;
    
    # Teste de métodos GET
    location /test-get {
        allowed_methods GET;
    }
    
    # Teste de métodos POST
    location /test-post {
        allowed_methods POST;
        upload_dir /tmp/test-uploads;
    }
    
    # Teste de métodos DELETE
    location /test-delete {
        allowed_methods DELETE;
        root /tmp/test-delete;
    }
    
    # Teste de múltiplos métodos
    location /test-multi {
        allowed_methods GET POST DELETE;
    }
    
    # Teste de redirect 301
    location /test-redirect-301 {
        return 301 /redirected;
    }
    
    # Teste de redirect 302
    location /test-redirect-302 {
        return 302 /temporary;
    }
    
    # Teste de autoindex
    location /test-autoindex {
        autoindex on;
    }
    
    # Teste de CGI PHP
    location /test-php {
        allowed_methods GET POST;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
    }
    
    # Teste de CGI Python
    location /test-python {
        allowed_methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
    
    # Teste de root diferente
    location /test-root {
        root /var/www/alternative;
        allowed_methods GET;
    }
    
    # Teste de client_max_body_size específico
    location /test-small-upload {
        allowed_methods POST;
        client_max_body_size 1M;
    }
    
    # Teste de index específico
    location /test-index {
        index custom.html fallback.html;
    }
}

# ============================================================================
# NOTAS DE IMPLEMENTAÇÃO:
# ============================================================================
# 
# 1. MÉTODOS HTTP:
#    - allowed_methods pode conter: GET, POST, DELETE
#    - Se não especificado, assume GET por padrão
#
# 2. REDIRECTS:
#    - return <código> <URL>
#    - Códigos comuns: 301 (permanente), 302 (temporário), 307, 308
#
# 3. AUTOINDEX:
#    - autoindex on: lista arquivos do diretório
#    - autoindex off: retorna 403 Forbidden (padrão)
#
# 4. CGI:
#    - cgi_extension: extensão do arquivo (.php, .py, etc)
#    - cgi_path: caminho do interpretador
#    - Executa via fork() + execve()
#
# 5. UPLOAD:
#    - upload_dir: onde salvar arquivos enviados via POST
#    - Requer método POST em allowed_methods
#
# 6. CLIENT_MAX_BODY_SIZE:
#    - Pode ser global (server) ou específico (location)
#    - Location sobrescreve server
#    - Formatos: 10M, 500K, 1000 (bytes)
#
# 7. ROOT:
#    - Pode ser global (server) ou específico (location)
#    - Location sobrescreve server
#    - Caminho absoluto ou relativo ao executável
#
# 8. INDEX:
#    - Lista de arquivos em ordem de prioridade
#    - Se nenhum existir e autoindex=off → 403
#    - Se nenhum existir e autoindex=on → lista diretório
#
# ============================================================================
