server {
    listen 127.0.0.1:8080;
    server_name youpi.test;
    root YoupiBanane;
    index index.html;

    # / must respond to GET ONLY
    location / {
        allowed_methods GET;
        index index.html;
    }

    # /post_body responds to POST with maxBody of 100 bytes
    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
        index index.html;
    }

    # /directory/ serves YoupiBanane with youpi.bad_extension as index
    location /directory/ {
        allowed_methods GET;
        root YoupiBanane;
        index youpi.bad_extension;
    }

    # Files with .bla extension respond to POST by calling cgi_test
    location /youpi.bla {
        allowed_methods POST;
        root YoupiBanane;
        cgi_extension .bla;
        cgi_path YoupiBanane/cgi_tester;
    }

    # Error pages
    # error_page 404 /errors/404.html;
    # error_page 405 /errors/405.html;
    # error_page 413 /errors/413.html;
}