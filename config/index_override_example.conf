# ============================================================================
# Exemplo prático: INDEX OVERRIDE
# Demonstra diferentes arquivos index para diferentes locations
# ============================================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root www;
    
    # Index padrão do servidor (usado se location não sobrescrever)
    index index.html index.htm default.html;
    
    # --------------------------------------------------
    # EXEMPLO 1: Site principal usa index padrão
    # --------------------------------------------------
    location / {
        allowed_methods GET;
        # Usa: index.html, index.htm, default.html (do server)
    }
    
    # --------------------------------------------------
    # EXEMPLO 2: Documentação usa README
    # --------------------------------------------------
    location /docs {
        allowed_methods GET;
        index README.html README.md;    # ← OVERRIDE!
        # Ignora index.html do server, busca README primeiro
        autoindex on;
    }
    
    # --------------------------------------------------
    # EXEMPLO 3: Blog usa index.php (WordPress/PHP)
    # --------------------------------------------------
    location /blog {
        allowed_methods GET POST;
        index index.php blog.php;    # ← OVERRIDE!
        # Prioriza PHP sobre HTML
    }
    
    # --------------------------------------------------
    # EXEMPLO 4: Admin usa dashboard
    # --------------------------------------------------
    location /admin {
        allowed_methods GET POST;
        index dashboard.html admin.html index.html;    # ← OVERRIDE!
        # dashboard.html tem prioridade máxima
    }
    
    # --------------------------------------------------
    # EXEMPLO 5: API não precisa de index (JSON puro)
    # --------------------------------------------------
    location /api {
        allowed_methods GET POST DELETE;
        # Não define index → usa do server (index.html)
    }
    
    # --------------------------------------------------
    # EXEMPLO 6: Multi-idioma
    # --------------------------------------------------
    location /pt {
        allowed_methods GET;
        index index-pt.html index-pt.htm;
    }
    
    location /en {
        allowed_methods GET;
        index index-en.html index-en.htm;Index override
    }
    
    location /fr {
        allowed_methods GET;
        index index-fr.html index-fr.htm;
    }
}

# ============================================================================
# ESTRUTURA DE ARQUIVOS NECESSÁRIA:
# ============================================================================
# 
# www/
# ├── index.html                    ← Usado por /
# ├── docs/
# │   ├── README.html               ← Usado por /docs/
# │   └── api/
# │       └── README.html           ← Usado por /docs/api/
# ├── blog/
# │   └── index.php                 ← Usado por /blog/
# ├── admin/
# │   └── dashboard.html            ← Usado por /admin/
# ├── pt/
# │   └── index-pt.html             ← Usado por /pt/
# ├── en/
# │   └── index-en.html             ← Usado por /en/
# └── fr/
#     └── index-fr.html             ← Usado por /fr/
#
# ============================================================================
# COMPORTAMENTO:
# ============================================================================
#
# GET /                → Busca: index.html, index.htm, default.html
# GET /about.html      → Retorna: www/about.html (arquivo específico)
#
# GET /docs/           → Busca: README.html, README.md (OVERRIDE!)
# GET /docs/guide/     → Busca: README.html, README.md
#
# GET /blog/           → Busca: index.php, blog.php (OVERRIDE!)
#
# GET /admin/          → Busca: dashboard.html, admin.html, index.html
#
# GET /pt/             → Busca: index-pt.html, index-pt.htm
# GET /en/             → Busca: index-en.html, index-en.htm
#
# ============================================================================
# TESTES RECOMENDADOS:
# ============================================================================
#
# 1. Testar site principal:
#    curl http://localhost:8080/
#    - Deve retornar: www/index.html
#
# 2. Testar documentação:
#    curl http://localhost:8080/docs/
#    - Deve retornar: www/docs/README.html (não index.html!)
#
# 3. Testar admin:
#    curl http://localhost:8080/admin/
#    - Deve retornar: www/admin/dashboard.html
#
# 4. Testar multi-idioma:
#    curl http://localhost:8080/pt/
#    - Deve retornar: www/pt/index-pt.html
#
# 5. Testar fallback:
#    Se /docs/README.html não existir → mostra autoindex (lista arquivos)
#    Se /admin/dashboard.html não existir → busca admin.html → index.html
#
# ============================================================================
