server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root www;
    index index.html;
    
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    
    client_max_body_size 10M;

    location /uploads {
        allowed_methods GET POST DELETE;
        root /tmp/uploads;
        upload_dir uploads;
        client_max_body_size 50M;
        autoindex on;
    }
}