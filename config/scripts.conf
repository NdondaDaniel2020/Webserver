server {
    listen 127.0.0.1:8080;
    server_name Webserver/1.0;
    root www;
    index index.html;

    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 5xx /errors/500.html;
    error_page 403 /errors/403.html;
    error_page 405 /errors/405.html;
    
    client_max_body_size 10M;

    location / {
        allowed_methods GET;
        index index.html;
    }

    location /uploads {
        allowed_methods GET POST DELETE;
        root www/uploads;
        upload_dir uploads;
        client_max_body_size 50M;
        autoindex on;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /redirect-external {
        return 302 https://www.google.com;
    }

    location /scripts {
        allowed_methods GET;
        index index.html;
    }

    location /youpi.c {
        allowed_methods GET POST DELETE;
        cgi_extension .bla;
        cgi_path /usr/bin/cc;
    }

    location /youpi.cpp {
        allowed_methods GET POST;
        cgi_extension .bla;
        cgi_path /usr/bin/c++;
    }

    location /youpi.py {
        allowed_methods POST DELETE ;
        cgi_extension .bla;
        cgi_path /usr/bin/python3;
    }
}
