
comands:
  curl -I -X GET http://127.0.0.1:8080/uploads
  curl -X POST -H "Content-Type: plain/text" --data "abc"
  curl -X POST -F "file=@/path/to/file" http://127.0.0.1:8080/upload
  curl -X POST -H "Content-Type: application/octet-stream" --data-binary "@./tests/file.mp4" "http://127.0.0.1:8080/uploads/"
  curl -X DELETE http://127.0.0.1:8080/delete/123
  
  
  wrk -t4 -c100 -d20s http://127.0.0.1:8080/index.html
  siege -c50 -r100 http://127.0.0.1:8080/index.html

cgi:
  curl -s -X POST http://127.0.0.1:8080/cgi-bin/form_save.py \
  -H "Content-Type: application/x-www-form-urlencoded" \
  -d "name=Test User&email=test@example.com&message=Teste"

  curl -s -X GET http://127.0.0.1:8080/cgi-bin/form_list.php

  curl -s -X DELETE "http://127.0.0.1:8080/cgi-bin/form_list.php?id=1"

cgi_cook:
  # Como Usar (Ninja Arena)
  # 1. Criar nova sessão:
      curl -v -X POST -d "action=new_game&name=MeuNinja&class=shadow" \
      http://127.0.0.1:8080/cgi-bin/arena_action.py
  # 2. Usar cookie em requisições subsequentes:
      curl -b "NAGSID=e5c74d64038d5035c02e63640f571e9e" \
      http://127.0.0.1:8080/cgi-bin/arena_action.py?action=state

valgrind:
   valgrind --leak-check=full  --track-fds=yes  --show-leak-kinds=all  ./webserv config/default.conf

wrk_siege:
  wrk -t4 -c50 -d10s http://127.0.0.1:8080/index.html

  siege -c50 -t10S -b http://127.0.0.1:8080/index.html

  siege -c50 -t10S -b http://127.0.0.1:8080/tests/index.html

  siege -c50 -t10S -b http://127.0.0.1:8080/cgi-bin/hello.php
